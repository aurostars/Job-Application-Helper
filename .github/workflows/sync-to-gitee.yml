name: 同步到 Gitee

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查同步配置
        id: config
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "未配置 GITEE_USERNAME / GITEE_TOKEN / GITEE_REPO，跳过同步。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Gitee 同步配置检查通过。"
          fi

      - name: 配置 Gitee 远端
        if: steps.config.outputs.ready == 'true'
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"

      - name: 同步 main 分支
        if: steps.config.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          git push gitee refs/remotes/origin/main:refs/heads/main

      - name: 同步当前标签
        if: steps.config.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          git push gitee "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: 手动触发时同步全部标签
        if: steps.config.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          git push gitee --tags
